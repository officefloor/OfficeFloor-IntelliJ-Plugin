# Project
pluginGroup = net.officefloor.ide.rest
# The development version. A release takes its version from the tag
# (v0.2.0 -> 0.2.0), passed as -PpluginVersion, so this is never edited for a release.
pluginVersion = 0.0.0-SNAPSHOT

# IntelliJ Platform target
# 2024.2 is the last line that still builds/runs on JDK 17.
platformType = IC
platformVersion = 2024.2.4

# Build range (242 == 2024.2). Leave untilBuild open-ended.
pluginSinceBuild = 242

# Gradle
org.gradle.jvmargs = -Xmx2g -XX:+UseParallelGC
org.gradle.caching = true
org.gradle.configuration-cache = true
kotlin.stdlib.default.dependency = false
